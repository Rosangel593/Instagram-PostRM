<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
</head>

<body>

    <div class="d-flex align-items-center h-100 justify-content-center">
        <div class="card" style="width: 450px;">
            <div class="card shadow-lg" style="width: 450px;">
            <div class="card-header">


                <div class="d-flex justify-content-between">
                    <div class="d-flex gap-3">
                        <img class="profile" src="assets-ig-post/user.jpg" alt="">
                        <div class="d-flex flex-column">
                            <span class="ff-ig-medium d-flex align-items-center gap-2">
                                <span>Jhon Doe</span>
                                <img src="/assets-ig-post/check.svg">
                                •
                                <small class="text-muted">8w</small>
                            </span>
                            <small class="ff-ig-light text-muted">Hotel California • Eagles</small>
                        </div>
                    </div>
                    <img src="assets-ig-post/options.svg">
                </div>
            </div>
            <div class="swiper mySwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <img src="/assets-ig-post/banner-1.jpg" class="w-100" style="height: 500px; object-fit: cover;">
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets-ig-post/banner-2.jpg" class="w-100" style="height: 500px; object-fit: cover;">
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets-ig-post/banner-3.jpg" class="w-100" style="height: 500px; object-fit: cover;">
                    </div>
                    <div class="swiper-slide">
                        <img src="/assets-ig-post/banner-4.jpg" class="w-100" style="height: 500px; object-fit: cover;">
                    </div>

                </div>
                <div class="swiper-button-next"></div>
                <div class="swiper-button-prev"></div>
            </div>
            <div class="card-body">
                <div class="d-flex justify-content-between mb-3">
                    <div class="d-flex gap-3">
                        <img src="assets-ig-post/hearth.svg" alt="">
                        <img src="assets-ig-post/comments.svg" alt="">
                        <img src="assets-ig-post/share.svg" alt="">
                    </div>
                    <img src="assets-ig-post/mark.svg" alt="">
                </div>
                <small class="ff-ig-medium">248,065 likes</small><br>
                <small class="text-muted">The best images to create instagram post</small>
            </div>
        </div>
    </div>



   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
<script>
    new Swiper(".mySwiper", {
        loop: true,
        navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
        },
    });
    </script>
    </div>
</body>

</html>
